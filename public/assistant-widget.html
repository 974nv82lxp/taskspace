<!-- TASKSPACE AI ASSISTANT -->
<div id="taskspace-assistant" class="assistant-widget hidden">
    <section
        id="assistant-panel"
        class="assistant-panel hidden"
        aria-label="TaskSpace AI Assistant"
    >
        <header class="assistant-header">
            <div class="assistant-header-info">
                <div class="assistant-avatar" aria-hidden="true">AI</div>

                <div>
                    <h2>TaskSpace Assistant</h2>
                    <p>Workspace helper</p>
                </div>
            </div>

            <button
                id="assistant-close"
                class="assistant-close"
                type="button"
                aria-label="Close assistant"
            >
                &times;
            </button>
        </header>

        <div
            id="assistant-messages"
            class="assistant-messages"
            aria-live="polite"
            aria-label="Assistant conversation"
        >
            <div class="assistant-message assistant-message-bot">
                <p>
                    Hello! I'm your TaskSpace assistant.
                </p>

                <p>
                    Soon I will be able to help you organize tasks,
                    prioritize work, and navigate your workspace.
                </p>

                <p class="assistant-message-note">
                    AI responses will be connected in the next development step.
                </p>
            </div>
        </div>

        <form id="assistant-form" class="assistant-form">
            <label class="assistant-sr-only" for="assistant-input">
                Write a message
            </label>

            <textarea
                id="assistant-input"
                rows="1"
                maxlength="2000"
                placeholder="Ask your assistant..."
                disabled
            ></textarea>

            <button
                id="assistant-send"
                type="submit"
                disabled
                aria-label="Send message"
            >
                Send
            </button>
        </form>

        <p class="assistant-footer">
            AI assistant · Connection coming soon
        </p>
    </section>

    <button
        id="assistant-toggle"
        class="assistant-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="assistant-panel"
    >
        <span class="assistant-toggle-icon" aria-hidden="true">✦</span>
        <span>AI Assistant</span>
    </button>
</div>
